name: CI

# DSクラフト用の CI。pre-push フックの `pnpm verify` と同じ項目を動かす。
# 本家にあった Vercel へのデプロイ・codecov・E2E は使わないので外している。
# デプロイは公開先が決まってから別のワークフローとして作る。
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (admin)
        run: pnpm test:admin

      - name: Test (webapp)
        run: pnpm test:webapp

      - name: Test (DSクラフトの設定・台帳の変換)
        run: pnpm test:ds

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unused code (knip)
        run: pnpm knip

      - name: Dependency rules
        run: pnpm depcruise

      - name: Usecase shape
        run: pnpm check:usecase-shape

